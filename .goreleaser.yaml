version: 2

project_name: dataforseo-cli

changelog:
  disable: true

builds:
  - id: dataforseo
    main: ./cmd/dataforseo
    binary: dataforseo-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
  - id: dataforseo_darwin
    main: ./cmd/dataforseo
    binary: dataforseo-cli
    ldflags: >-
      -s -w
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.version={{ .Tag }}
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/builtbyrobben/dataforseo-cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - ids:
      - dataforseo
      - dataforseo_darwin
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
